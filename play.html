<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Art &amp; Play 美術與遊戲 · 開心寶貝幼兒園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --milk:#FCF6EC; --milk-deep:#F6EBD9; --honey:#F4C95D; --coral:#F0997F; --coral-deep:#E67E5E;
  --sage:#9BBE8E; --sage-deep:#7CA36E; --sky:#A8CBE0; --plum:#C9A0C4;
  --ink:#4A3B30; --muted:#7A6A5C; --paper:#FFFDF8; --line:#E9D9C0; --shadow:rgba(74,59,48,.14);
  --display:"Fredoka","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--milk);color:var(--ink);font-family:"Nunito","Noto Sans TC",system-ui,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);cursor:pointer;color:var(--ink);-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Site top bar ---------- */
.site-header{position:sticky;top:0;z-index:50;background:rgba(252,246,236,.92);backdrop-filter:blur(8px);border-bottom:2px dashed var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:600 1.2rem/1.2 var(--display);color:var(--ink);text-decoration:none;white-space:nowrap}
.logo-img{height:42px;width:auto;flex:none;border-radius:10px}
.brand small{display:block;font-size:.68rem;color:var(--muted);font-family:"Fredoka","Nunito",sans-serif;font-weight:500}
.home{margin-left:auto;background:var(--coral);color:#fff;padding:8px 16px;border-radius:16px;text-decoration:none;font-weight:800;box-shadow:0 4px 0 var(--coral-deep);white-space:nowrap;line-height:1.15;text-align:center}
.home small{display:block;font-size:.68rem;font-weight:500;font-family:"Noto Sans TC",sans-serif;opacity:.9}
.home:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-deep)}
@media (max-width:520px){.brand .name{display:none}}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:18px 0 28px}
footer .heart{color:var(--coral)}

/* ---------- Page ---------- */
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font:600 clamp(1.5rem,6vw,2rem)/1.15 var(--display)}
h1 .zh{color:var(--coral-deep);font-family:"Noto Sans TC",sans-serif;font-weight:700;margin-left:.3em}
.seg{display:flex;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:16px;line-height:1;padding:0 12px;min-height:38px;min-width:40px;border-radius:999px;display:grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--honey);color:var(--ink)}
.seg svg{width:20px;height:20px}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.card{border:2px solid var(--line);background:var(--paper);border-radius:24px;padding:20px 14px;box-shadow:0 8px 20px var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .ic{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font-size:46px}
.card b{font:600 1.3rem/1.2 var(--display)}
.card span{font-family:"Noto Sans TC",sans-serif;color:var(--muted);font-weight:500}
.c1 .ic{background:#FBE3D9}.c2 .ic{background:#D3E7F3}.c3 .ic{background:#DCEBD5}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.back{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:6px 14px;font-weight:600;font-size:1rem;line-height:1.15}
.back small{display:block;font-family:"Noto Sans TC",sans-serif;font-size:.7rem;color:var(--muted)}
.bar h2{font:600 1.3rem/1.2 var(--display);margin-left:4px}
.bar h2 small{font-family:"Noto Sans TC",sans-serif;color:var(--muted);font-size:.9rem;margin-left:.4em}
.bar .seg{margin-left:auto}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:26px;box-shadow:0 8px 20px var(--shadow);padding:14px;position:relative;overflow:hidden}
.say-line{text-align:center;font:600 1.1rem var(--display);color:var(--muted);min-height:1.6em}

/* Coloring */
.pic{width:100%;max-width:460px;display:block;margin:0 auto;touch-action:manipulation}
.pic .f{cursor:pointer;transition:fill .2s}
.palette{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.palette button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.palette button[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink);transform:scale(1.1)}
.tools{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tools button{border:2px solid var(--line);background:var(--milk);border-radius:14px;min-width:56px;height:52px;font-size:28px;padding:0 10px}
.tools button[aria-pressed="true"]{border-color:var(--coral-deep);background:#FBE3D9}
.tools .txt{font-size:1rem;font-weight:600}

/* Memory */
.grid{display:grid;gap:10px;margin:0 auto;max-width:520px}
.mc{aspect-ratio:1;border:0;background:none;perspective:600px;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mc.open .in,.mc.got .in{transform:rotateY(180deg)}
.mc .fr,.mc .bk{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mc .bk{background:var(--coral);border:3px solid #fff;box-shadow:0 0 0 2px var(--coral-deep);font-size:2rem;color:#fff}
.mc .fr{background:var(--milk);border:3px solid var(--line);transform:rotateY(180deg);font-size:clamp(2rem,9vw,3.4rem)}
.mc.got .fr{border-color:var(--sage-deep);background:#EEF5EA}
.mc.wrong .in{animation:wob .4s}
@keyframes wob{25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}

/* Shape sorter */
.board{display:flex;flex-direction:column;gap:22px;align-items:center;padding:8px 0;touch-action:none}
.holes,.tray{display:grid;grid-template-columns:repeat(auto-fit,88px);justify-content:center;gap:14px;min-height:96px}
.hole{width:88px;height:88px;border-radius:18px;background:var(--milk-deep);display:grid;place-items:center}
.hole.hit{animation:pop .4s}
.holes{width:100%}
.tray{background:var(--milk);border-radius:20px;padding:12px;width:100%}
.piece{width:88px;height:88px;touch-action:none;cursor:grab;position:relative;z-index:1;border:0;background:none}
.piece.drag{z-index:20;cursor:grabbing;filter:drop-shadow(0 8px 8px rgba(74,59,48,.25))}
.piece.home{transition:transform .3s}
.piece svg,.hole svg{width:100%;height:100%;display:block}
@keyframes pop{50%{transform:scale(1.15)}}

.again{display:block;margin:14px auto 0;border:0;background:var(--sage-deep);color:#fff;border-radius:18px;padding:12px 26px;font-size:1.2rem;font-weight:600;box-shadow:0 4px 0 #5E8752;line-height:1.15}
.again small{display:block;font-family:"Noto Sans TC",sans-serif;font-size:.8rem;opacity:.9}

.burst{position:absolute;inset:0;pointer-events:none;z-index:30}
.burst i{position:absolute;left:50%;top:45%;width:28px;height:28px;margin:-14px;background:var(--honey);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const MUTED='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const st=Object.assign({lang:'en',sound:true,pairs:3,shapes:3},store.get('hbd.play',{}));
const save=()=>store.set('hbd.play',{lang:st.lang,sound:st.sound,pairs:st.pairs,shapes:st.shapes});
const L=(en,zh)=>st.lang==='zh'?zh:en;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function say(t){if(!st.sound||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=st.lang==='zh'?'zh-TW':'en-US';u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
function burst(id){const b=$(id);b.innerHTML='';
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=120+Math.random()*70,s=document.createElement('i');
    s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');b.appendChild(s)}
  setTimeout(()=>b.innerHTML='',1300)}

/* ---------- Navigation & language ---------- */
let view='menu';
function go(v){view=v;['menu','color','memory','shapes'].forEach(id=>$('#'+id).hidden=id!==v);
  if(v==='color')startColor();if(v==='memory')startMemory();if(v==='shapes')startShapes();
  window.scrollTo({top:0})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){go(b.dataset.go);
  const names={color:L('Coloring book','著色本'),memory:L('Memory match','記憶翻翻樂'),shapes:L('Shape sorter','形狀配對')};
  if(names[b.dataset.go])say(names[b.dataset.go])}});
function syncBar(){
  document.querySelectorAll('#langSeg button[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.lang));
  $('#sound').innerHTML=st.sound?SPEAKER:MUTED;$('#sound').setAttribute('aria-pressed',st.sound);
  document.querySelectorAll('#pairSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===st.pairs));
  document.querySelectorAll('#shapeSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===st.shapes));
  document.documentElement.lang=st.lang==='zh'?'zh-Hant':'en';}
$('#langSeg').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;st.lang=b.dataset.v;save();syncBar();refreshLines()});
$('#sound').onclick=()=>{st.sound=!st.sound;save();syncBar();if(!st.sound)try{speechSynthesis.cancel()}catch(e){}};

/* ---------- Coloring book ---------- */
const COLORS=[['#E5484D','red','紅色'],['#F28C38','orange','橘色'],['#F4C95D','yellow','黃色'],['#7CC45E','green','綠色'],['#4FA3E0','blue','藍色'],
  ['#9B7BF0','purple','紫色'],['#F28DB8','pink','粉紅色'],['#9A6A45','brown','咖啡色'],['#4A3B30','black','黑色'],['#FFFFFF','white','白色']];
const O='stroke="#4A3B30" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
const F=(tag,attrs)=>`<${tag} class="f" fill="#fff" ${O} ${attrs}/>`;
const PICS={
 fish:{icon:'🐟',en:'fish',zh:'小魚',svg:
  F('polygon','points="210,150 270,100 262,150 270,200"')+
  F('path','d="M130 92 Q160 55 190 100 Z"')+
  F('ellipse','cx="140" cy="150" rx="85" ry="60"')+
  F('path','d="M150 155 Q175 175 160 200 Q140 185 150 155 Z"')+
  F('circle','cx="100" cy="135" r="15"')+
  `<circle cx="96" cy="135" r="6" fill="#4A3B30" pointer-events="none"/>`+
  F('circle','cx="60" cy="80" r="12"')+F('circle','cx="45" cy="45" r="8"')+
  `<path d="M55 165 Q70 175 85 165" fill="none" pointer-events="none" ${O}/>`},
 house:{icon:'🏠',en:'house',zh:'房子',svg:
  F('circle','cx="245" cy="50" r="28"')+
  F('rect','x="0" y="250" width="300" height="50"')+
  F('rect','x="190" y="55" width="26" height="50"')+
  F('rect','x="65" y="140" width="170" height="110"')+
  F('polygon','points="45,145 150,60 255,145"')+
  F('rect','x="128" y="185" width="44" height="65" rx="4"')+
  F('rect','x="80" y="160" width="36" height="34"')+
  F('rect','x="184" y="160" width="36" height="34"')+
  `<circle cx="162" cy="220" r="4" fill="#4A3B30" pointer-events="none"/>`},
 flower:{icon:'🌷',en:'flower',zh:'花',svg:
  F('rect','x="143" y="140" width="14" height="100"')+
  F('ellipse','cx="115" cy="200" rx="28" ry="13" transform="rotate(-25 115 200)"')+
  F('ellipse','cx="185" cy="185" rx="28" ry="13" transform="rotate(25 185 185)"')+
  [0,60,120,180,240,300].map(a=>{const r=a*Math.PI/180;return F('circle',`cx="${(150+48*Math.cos(r)).toFixed(1)}" cy="${(105+48*Math.sin(r)).toFixed(1)}" r="30"`)}).join('')+
  F('circle','cx="150" cy="105" r="28"')+
  F('polygon','points="100,235 200,235 185,290 115,290"')},
 car:{icon:'🚗',en:'car',zh:'汽車',svg:
  F('rect','x="0" y="245" width="300" height="55"')+
  F('path','d="M85 140 L115 95 L195 95 L225 140 Z"')+
  F('path','d="M35 145 Q35 135 50 135 L255 135 Q270 135 270 150 L270 205 L35 205 Z"')+
  F('path','d="M100 135 L120 105 L148 105 L148 135 Z"')+
  F('path','d="M160 135 L160 105 L188 105 L208 135 Z"')+
  F('rect','x="250" y="155" width="20" height="16" rx="4"')+
  F('circle','cx="90" cy="210" r="32"')+F('circle','cx="215" cy="210" r="32"')+
  F('circle','cx="90" cy="210" r="12"')+F('circle','cx="215" cy="210" r="12"')}
};
let cur={pic:'fish',color:0};
function startColor(){
  $('#palette').innerHTML=COLORS.map((c,i)=>`<button data-i="${i}" style="background:${c[0]}" aria-label="${c[1]}"></button>`).join('');
  $('#picks').innerHTML=Object.entries(PICS).map(([k,p])=>`<button data-p="${k}" aria-label="${p.en}">${p.icon}</button>`).join('')+
    `<button class="txt" id="clearBtn">🧽 Clear · 清除</button>`;
  loadPic(cur.pic);syncColor()}
function loadPic(k){cur.pic=k;cur.filled=false;$('#pic').innerHTML=PICS[k].svg;syncColor();refreshLines()}
function syncColor(){
  document.querySelectorAll('#palette button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===cur.color));
  document.querySelectorAll('#picks button[data-p]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===cur.pic))}
$('#palette').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur.color=+b.dataset.i;syncColor();
  const c=COLORS[cur.color];say(L(c[1],c[2]))});
$('#picks').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='clearBtn'){loadPic(cur.pic);return}
  loadPic(b.dataset.p);const p=PICS[b.dataset.p];say(L('Let\'s color the '+p.en,'我們來畫'+p.zh))});
$('#pic').addEventListener('click',e=>{const t=e.target.closest('.f');if(!t)return;
  t.setAttribute('fill',COLORS[cur.color][0]);t.dataset.done=1;
  const all=[...document.querySelectorAll('#pic .f')];
  if(!cur.filled&&all.every(x=>x.dataset.done)){cur.filled=true;burst('#burstC');say(L('Beautiful! What a lovely '+PICS[cur.pic].en,'好漂亮的'+PICS[cur.pic].zh+'！'))}});

/* ---------- Memory match ---------- */
const ITEMS=[['🍎','apple','蘋果'],['🐱','cat','貓咪'],['🐶','dog','小狗'],['🐟','fish','魚'],['⭐','star','星星'],['🚗','car','汽車'],
  ['🦆','duck','鴨子'],['🍌','banana','香蕉'],['⚽','ball','球'],['☀️','sun','太陽'],['🐰','rabbit','兔子'],['🌸','flower','花']];
let mem={cards:[],open:[],lock:false,found:0,tries:0};
function startMemory(){
  const pick=shuffle(ITEMS.slice()).slice(0,st.pairs);
  mem={cards:shuffle([...pick,...pick].map(x=>({item:x}))),open:[],lock:false,found:0,tries:0};
  const g=$('#grid'),cols=st.pairs===2?2:st.pairs===3?3:4;
  g.style.gridTemplateColumns=`repeat(${cols},1fr)`;g.style.maxWidth=cols===2?'320px':cols===3?'440px':'520px';
  g.innerHTML=mem.cards.map((c,i)=>`<button class="mc" data-i="${i}" aria-label="Card ${i+1}"><div class="in"><div class="bk">?</div><div class="fr">${c.item[0]}</div></div></button>`).join('');
  $('#memAgain').hidden=true;refreshLines()}
$('#grid').addEventListener('click',e=>{const b=e.target.closest('.mc');if(!b||mem.lock)return;
  const i=+b.dataset.i,c=mem.cards[i];if(c.got||mem.open.includes(i))return;
  b.classList.add('open');mem.open.push(i);say(L(c.item[1],c.item[2]));
  if(mem.open.length<2)return;
  mem.lock=true;mem.tries++;const [a,z]=mem.open,ca=mem.cards[a],cz=mem.cards[z],els=document.querySelectorAll('#grid .mc');
  if(ca.item===cz.item){
    setTimeout(()=>{ca.got=cz.got=true;els[a].classList.add('got');els[z].classList.add('got');mem.open=[];mem.lock=false;mem.found++;
      if(mem.found===st.pairs){burst('#burstM');$('#memAgain').hidden=false;$('#memLine').textContent=L('You found them all! 🎉','全部找到了！🎉');
        say(L('Great job! You found them all!','好棒！全部都找到了！'))}
      else say(L('A match!','配對成功！'))},500)}
  else{setTimeout(()=>{els[a].classList.add('wrong');els[z].classList.add('wrong')},500);
    setTimeout(()=>{els[a].classList.remove('open','wrong');els[z].classList.remove('open','wrong');mem.open=[];mem.lock=false},1300)}});
$('#pairSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.pairs=+b.dataset.v;save();syncBar();startMemory()});
$('#memAgain').onclick=startMemory;

/* ---------- Shape sorter ---------- */
const SH={
 circle:{en:'circle',zh:'圓形',color:'#E5484D',d:'<circle cx="50" cy="50" r="40"/>'},
 square:{en:'square',zh:'正方形',color:'#4FA3E0',d:'<rect x="12" y="12" width="76" height="76" rx="6"/>'},
 triangle:{en:'triangle',zh:'三角形',color:'#7CC45E',d:'<polygon points="50,10 92,88 8,88"/>'},
 star:{en:'star',zh:'星形',color:'#F4C95D',d:'<polygon points="50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38"/>'},
 heart:{en:'heart',zh:'愛心',color:'#F28DB8',d:'<path d="M50 88 C20 66 6 48 10 30 C14 14 36 10 50 28 C64 10 86 14 90 30 C94 48 80 66 50 88 Z"/>'}
};
const shapeSvg=(k,fill,dashed)=>`<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${fill}" stroke="#4A3B30" stroke-width="${dashed?4:4}" stroke-linejoin="round" ${dashed?'stroke-dasharray="8 7" opacity=".75"':''}>${SH[k].d}</g></svg>`;
let sorter={left:0};
function startShapes(){
  const all=Object.keys(SH),use=st.shapes===3?['circle','square','triangle']:all;
  $('#holes').innerHTML=shuffle(use.slice()).map(k=>`<div class="hole" data-k="${k}">${shapeSvg(k,'none',true)}</div>`).join('');
  $('#tray').innerHTML=shuffle(use.slice()).map(k=>`<button class="piece home" data-k="${k}" aria-label="${SH[k].en}">${shapeSvg(k,SH[k].color)}</button>`).join('');
  sorter.left=use.length;$('#shapeAgain').hidden=true;$('#tray').hidden=false;refreshLines();
  document.querySelectorAll('.piece').forEach(bindDrag)}
function bindDrag(p){
  let sx=0,sy=0,dx=0,dy=0,r0=null,moved=false,id=null;
  p.addEventListener('pointerdown',e=>{id=e.pointerId;p.setPointerCapture(id);sx=e.clientX;sy=e.clientY;dx=dy=0;r0=p.getBoundingClientRect();moved=false;
    p.classList.remove('home');p.classList.add('drag');const k=p.dataset.k;say(L(SH[k].en,SH[k].zh))});
  p.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;dx=e.clientX-sx;dy=e.clientY-sy;if(Math.hypot(dx,dy)>4)moved=true;
    p.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`});
  const end=e=>{if(e.pointerId!==id)return;id=null;p.classList.remove('drag');
    const cx=r0.left+r0.width/2+dx,cy=r0.top+r0.height/2+dy;
    let hit=null;document.querySelectorAll('.hole').forEach(h=>{const q=h.getBoundingClientRect();
      if(Math.hypot(cx-(q.left+q.width/2),cy-(q.top+q.height/2))<q.width*.6)hit=h});
    if(hit&&!hit.dataset.done&&hit.dataset.k===p.dataset.k){
      hit.dataset.done=1;hit.innerHTML=shapeSvg(p.dataset.k,SH[p.dataset.k].color);hit.classList.add('hit');
      p.style.visibility='hidden';p.style.transform='';p.disabled=true;sorter.left--;
      if(!sorter.left){burst('#burstS');$('#tray').hidden=true;$('#shapeAgain').hidden=false;$('#shapeLine').textContent=L('All sorted! 🎉','全部放好了！🎉');
        say(L('Hooray! You sorted all the shapes!','太棒了！形狀都放好了！'))}
      else say(L('Yes! '+SH[p.dataset.k].en,'對了！'+SH[p.dataset.k].zh))}
    else{if(hit&&moved)say(L('Try another hole','換一個洞試試看'));p.classList.add('home');p.style.transform=''}};
  p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end)}
$('#shapeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.shapes=+b.dataset.v;save();syncBar();startShapes()});
$('#shapeAgain').onclick=startShapes;

/* ---------- Instruction lines ---------- */
function refreshLines(){
  $('#colorLine').textContent=L('Pick a color, then tap the picture','選一個顏色，再點圖畫塗上去');
  if(mem.found<st.pairs)$('#memLine').textContent=L('Flip two cards to find a match','翻兩張牌，找一樣的');
  if(sorter.left)$('#shapeLine').textContent=L('Drag each shape into its hole','把形狀拖到一樣的洞裡')}

syncBar();refreshLines();
</script>
</body>
</html>
