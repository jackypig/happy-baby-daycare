<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Letter Trails 字母描寫 · 開心寶貝幼兒園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --milk:#FCF6EC; --milk-deep:#F6EBD9; --honey:#F4C95D; --coral:#F0997F; --coral-deep:#E67E5E;
  --sage:#9BBE8E; --sage-deep:#7CA36E; --shadow:rgba(74,59,48,.14);
  --bg:#FCF6EC; --paper:#FFFDF8; --ink:#4A3B30; --muted:#7A6A5C; --line:#E9D9C0;
  --rule-blue:#8DB6D6; --rule-red:#E67E5E; --guide:#F1E6D3; --guide-dot:#C9B79F;
  --trace:#E67E5E; --start:#6E9B60; --demo:#5E92C2; --chip:#FFFDF8;
  --display:"Fredoka","Noto Sans TC","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}

/* ---------- Site top bar (matches the main site) ---------- */
.site-header{position:sticky;top:0;z-index:50;background:rgba(252,246,236,.92);backdrop-filter:blur(8px);border-bottom:2px dashed var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:600 1.2rem/1.2 "Fredoka","Noto Sans TC",sans-serif;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo-img{height:42px;width:auto;flex:none;border-radius:10px}
.brand small{display:block;font-size:.68rem;color:var(--muted);font-family:"Fredoka","Nunito",sans-serif;font-weight:500}
.home{margin-left:auto;background:var(--coral);color:#fff;padding:8px 16px;border-radius:16px;text-decoration:none;font-weight:800;box-shadow:0 4px 0 var(--coral-deep);white-space:nowrap;line-height:1.15;text-align:center}
.home small{display:block;font-size:.68rem;font-weight:500;font-family:"Noto Sans TC",sans-serif;opacity:.9}
.home:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-deep)}
@media (max-width:520px){.brand .name{display:none}}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:18px 0 28px}
footer .heart{color:var(--coral)}

/* ---------- App ---------- */
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:600;font-size:1.6rem;letter-spacing:.2px;line-height:1.2}
h1 span{color:var(--trace)}
h1 .zh{display:block;font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:.95rem;color:var(--muted)}
.stars{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:1.1rem;
  background:var(--chip);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
.star{width:18px;height:18px;background:#F4C95D;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}

.controls button:disabled{opacity:.35;cursor:default}
.chip.locked{opacity:.35;cursor:default}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--chip);border:2px solid var(--line);border-radius:16px;padding:5px}
.tabs button{font-family:var(--display);font-weight:600;font-size:1.15rem;border:0;border-radius:12px;padding:10px 0;
  background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--honey);color:var(--ink)}

.pad-wrap{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:22px;
  height:min(50vh,440px);min-height:270px;overflow:hidden;box-shadow:0 8px 20px var(--shadow)}
#pad{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#pad.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-weight:800;color:var(--muted);font-size:1rem;pointer-events:none}
.hint.good{color:var(--start)}
.pulse{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25)}}

.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:45%;width:26px;height:26px;margin:-13px;background:#F4C95D;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.4);opacity:0}}

.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.controls button{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);
  background:var(--chip);color:var(--ink);border-radius:16px;padding:10px 4px 8px;font-family:var(--body);font-weight:800;font-size:.78rem;cursor:pointer}
.controls button svg{width:26px;height:26px}
.controls button:active{transform:translateY(2px)}
#next.ready{background:var(--sage-deep);color:#fff;border-color:var(--sage-deep);animation:pulse 1s ease-in-out infinite}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--demo);outline-offset:2px}

.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:thin}
.chip{position:relative;flex:0 0 auto;min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:2px solid var(--line);
  background:var(--chip);color:var(--ink);font-family:var(--display);font-weight:600;font-size:1.35rem;cursor:pointer}
.chip.on{border-color:var(--trace);color:var(--trace)}
.chip .got{position:absolute;top:-5px;right:-5px;width:16px;height:16px;background:#F4C95D;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}

.sentence{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--sage-deep);border-radius:18px;padding:14px 16px;animation:pop .35s ease-out}
.sentence p{margin:0;flex:1;min-width:0;font-family:var(--display);font-weight:500;font-size:1.5rem;line-height:1.3;text-wrap:balance}
.sentence mark{background:transparent;color:var(--trace);font-weight:600;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.sentence button{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:0;background:var(--sage-deep);color:#fff;display:grid;place-items:center;cursor:pointer}
.sentence button svg{width:26px;height:26px}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.pics{display:flex;flex-direction:column;gap:8px}
.pics h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--muted)}
.pic-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pic{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:16px;padding:8px 4px;cursor:pointer}
.pic .emo{font-size:2.1rem;line-height:1.15}
.pic .big{font-family:var(--display);font-weight:600;font-size:2.1rem;line-height:1.15;color:var(--trace)}
.pic .word{font-family:var(--display);font-weight:500;font-size:.95rem;overflow-wrap:anywhere;text-align:center}
.pic.on{border-color:var(--trace)}
.pic .got{position:absolute;top:-5px;right:-5px;width:16px;height:16px;background:#F4C95D;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

 B:{w:66,s:[LN(0,0,0,100),S(LN(0,0,36,0),ARC(36,25,26,25,-90,90),LN(36,50,0,50)),S(LN(0,50,38,50),ARC(38,75,28,25,-90,90),LN(38,100,0,100))]},
 C:{w:88,s:[ARC(45,50,43,50,-40,-320)]},
 D:{w:75,s:[LN(0,0,0,100),S(LN(0,0,25,0),ARC(25,50,50,50,-90,90),LN(25,100,0,100))]},
 E:{w:60,s:[LN(0,0,0,100),LN(0,0,60,0),LN(0,50,48,50),LN(0,100,60,100)]},
 F:{w:60,s:[LN(0,0,0,100),LN(0,0,60,0),LN(0,50,48,50)]},
 G:{w:88,s:[ARC(45,50,43,50,-40,-360),LN(55,50,88,50)]},
 H:{w:70,s:[LN(0,0,0,100),LN(70,0,70,100),LN(0,50,70,50)]},
 I:{w:44,s:[LN(22,0,22,100),LN(0,0,44,0),LN(0,100,44,100)]},
 J:{w:62,s:[S(LN(50,0,50,70),ARC(28,70,22,30,0,180)),LN(28,0,62,0)]},
 K:{w:65,s:[LN(0,0,0,100),LN(60,0,0,55),LN(18,42,65,100)]},
 L:{w:55,s:[LN(0,0,0,100,55,100)]},
 M:{w:85,s:[LN(0,0,0,100),LN(0,0,42,60,85,0,85,100)]},
 N:{w:70,s:[LN(0,0,0,100),LN(0,0,70,100,70,0)]},
 O:{w:90,s:[ARC(45,50,45,50,-90,-450)]},
 P:{w:62,s:[LN(0,0,0,100),P_BOWL]},
 Q:{w:94,s:[ARC(45,50,45,50,-90,-450),LN(55,72,94,106)]},
 R:{w:66,s:[LN(0,0,0,100),P_BOWL,LN(28,54,66,100)]},
 S:{w:80,s:[S(ARC(42,25,36,25,-30,-270),ARC(42,75,38,25,-90,150))]},
 T:{w:70,s:[LN(0,0,70,0),LN(35,0,35,100)]},
 U:{w:72,s:[S(LN(0,0,0,64),ARC(36,64,36,36,180,0),LN(72,64,72,0))]},
 V:{w:75,s:[LN(0,0,37,100,75,0)]},
 W:{w:95,s:[LN(0,0,22,100,47,30,72,100,95,0)]},
 X:{w:70,s:[LN(0,0,70,100),LN(70,0,0,100)]},
 Y:{w:70,s:[LN(0,0,35,50),LN(70,0,35,50,35,100)]},
 Z:{w:70,s:[LN(0,0,70,0,0,100,70,100)]}
};
const MAGIC_C=ARC(26,72.5,26,27.5,-20,-380), BUMP=ARC(26,72.5,26,27.5,180,535);
const LO={
 a:{w:52,s:[MAGIC_C,LN(52,45,52,100)]},
 b:{w:52,s:[LN(0,0,0,100),BUMP]},
 c:{w:54,s:[ARC(28,72.5,26,27.5,-40,-320)]},
 d:{w:52,s:[MAGIC_C,LN(52,0,52,100)]},
 e:{w:54,s:[S(LN(2,72.5,54,72.5),ARC(28,72.5,26,27.5,0,-320))]},
 f:{w:50,s:[S(ARC(40,20,14,20,-20,-180),LN(26,20,26,100)),LN(8,45,46,45)]},
 g:{w:52,s:[MAGIC_C,S(LN(52,45,52,115),ARC(32,115,20,20,0,160))]},
 h:{w:46,s:[LN(0,0,0,100),S(ARC(23,70,23,25,180,360),LN(46,70,46,100))]},
 i:{w:20,s:[LN(10,45,10,100),LN(10,24,10,26)]},
 j:{w:44,s:[S(LN(36,45,36,115),ARC(18,115,18,20,0,160)),LN(36,24,36,26)]},
 k:{w:46,s:[LN(0,0,0,100),LN(42,45,0,80),LN(14,70,46,100)]},
 l:{w:16,s:[LN(8,0,8,100)]},
 m:{w:72,s:[LN(0,45,0,100),S(ARC(18,70,18,25,180,360),LN(36,70,36,100)),S(ARC(54,70,18,25,180,360),LN(72,70,72,100))]},
 n:{w:46,s:[LN(0,45,0,100),S(ARC(23,70,23,25,180,360),LN(46,70,46,100))]},
 o:{w:56,s:[ARC(28,72.5,28,27.5,-90,-450)]},
 p:{w:52,s:[LN(0,45,0,135),BUMP]},
 q:{w:52,s:[MAGIC_C,LN(52,45,52,135)]},
 r:{w:40,s:[LN(0,45,0,100),ARC(22,70,22,24,180,310)]},
 s:{w:44,s:[S(ARC(22,58.75,19,13.75,-30,-270),ARC(22,86.25,21,13.75,-90,150))]},
 t:{w:40,s:[LN(20,12,20,100),LN(4,45,38,45)]},
 u:{w:46,s:[S(LN(0,45,0,77),ARC(23,77,23,23,180,0),LN(46,77,46,45)),LN(46,45,46,100)]},
 v:{w:52,s:[LN(0,45,26,100,52,45)]},
 w:{w:72,s:[LN(0,45,18,100,36,60,54,100,72,45)]},
 x:{w:46,s:[LN(0,45,46,100),LN(46,45,0,100)]},
 y:{w:52,s:[LN(0,45,26,100),LN(52,45,12,135)]},
 z:{w:46,s:[LN(0,45,46,45,0,100,46,100)]}
};

/* ---------- Storage (optional, per device) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let stars=store.get('hbd.lt.stars',{});
/* Picture words for each letter: [word, picture]. X uses words that end in x. */
const PICS={
 A:[['apple','🍎'],['ant','🐜'],['arm','💪']], B:[['bus','🚌'],['bee','🐝'],['ball','⚽']],
 C:[['cat','🐱'],['car','🚗'],['cake','🎂']], D:[['dog','🐶'],['duck','🦆'],['drum','🥁']],
 E:[['egg','🥚'],['ear','👂'],['eye','👁️']], F:[['fish','🐟'],['frog','🐸'],['fox','🦊']],
 G:[['goat','🐐'],['gift','🎁'],['grapes','🍇']], H:[['hat','🎩'],['hen','🐔'],['hand','✋']],
 I:[['ice','🧊'],['insect','🐞'],['ink','🖋️']], J:[['jet','✈️'],['juice','🧃'],['jeans','👖']],
 K:[['kite','🪁'],['key','🔑'],['kiwi','🥝']], L:[['lion','🦁'],['leaf','🍃'],['lemon','🍋']],
 M:[['moon','🌙'],['mug','☕'],['mouse','🐭']], N:[['nest','🪺'],['nose','👃'],['nut','🥜']],
 O:[['owl','🦉'],['ox','🐂'],['orange','🍊']], P:[['pig','🐷'],['pen','🖊️'],['pizza','🍕']],
 Q:[['queen','👸'],['quiet','🤫'],['quill','🪶']], R:[['rain','🌧️'],['robot','🤖'],['rabbit','🐰']],
 S:[['sun','☀️'],['star','⭐'],['sock','🧦']], T:[['tree','🌳'],['tiger','🐯'],['train','🚂']],
 U:[['up','⬆️'],['unicorn','🦄'],['umbrella','☂️']], V:[['van','🚐'],['violin','🎻'],['volcano','🌋']],
 W:[['web','🕸️'],['whale','🐳'],['watch','⌚']], X:[['box','📦'],['fox','🦊'],['six','6️⃣']],
 Y:[['yarn','🧶'],['yawn','🥱'],['yellow','💛']], Z:[['zebra','🦓'],['zero','0️⃣'],['zip','🤐']]
};
const picLine=(L,w)=>L.toUpperCase()==='X'?`${w[0].toUpperCase()+w.slice(1)} ends with x.`:`${L} is for ${w}.`;
function showSentence(w,s){
  st.line=s;const p=$('#sentenceText');p.textContent='';
  const m=s.match(new RegExp(`\\b${w}\\b`,'i'));
  if(m){const k=document.createElement('mark');k.textContent=m[0];p.append(s.slice(0,m.index),k,s.slice(m.index+m[0].length))}
  else p.textContent=s;
  $('#sentence').hidden=false}

/* ---------- Geometry ---------- */
function resample(pts,step){
  const out=[pts[0]];let prev=pts[0],carry=0;
  for(let i=1;i<pts.length;i++){
    let a=prev,b=pts[i],seg=Math.hypot(b[0]-a[0],b[1]-a[1]);
    while(seg>0&&carry+seg>=step){const t=(step-carry)/seg;const np=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
      out.push(np);a=np;seg=Math.hypot(b[0]-a[0],b[1]-a[1]);carry=0}
    carry+=seg;prev=b}
  const last=pts[pts.length-1],lo=out[out.length-1];
  if(Math.hypot(last[0]-lo[0],last[1]-lo[1])>0.5)out.push(last);
  return out}
function buildItem(text){
  const strokes=[];let x=0,count=0;
  [...text].forEach(ch=>{
    if(ch===' '){x+=30;return}
    const def=(ch>='A'&&ch<='Z'?UP:LO)[ch];if(!def)return;
    if(count)x+=24;
    def.s.forEach((s,n)=>strokes.push({pts:resample(s.map(([a,b])=>[a+x,b]),2.5),n:n+1}));
    x+=def.w;count++});
  return{strokes,width:x}}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const pathD=(pts,to=pts.length-1)=>{let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<=to;i++)d+=`L${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;return d};

/* ---------- State ---------- */
const $=s=>document.querySelector(s);
const svg=$('#pad'),gStatic=$('#static'),gDyn=$('#dyn'),hint=$('#hint');
const st={mode:'caps',list:[],idx:0,sub:-1,line:'',strokes:[],width:0,si:0,prog:0,down:false,engaged:false,off:0,trail:[],demo:false,done:false};
const LISTS={caps:[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],lower:[...'abcdefghijklmnopqrstuvwxyz']};
const key=t=>st.mode+':'+t;
const caseFor=w=>st.mode==='caps'?w.toUpperCase():w;
function curText(){const t=st.list[st.idx];
  return st.sub>=0?caseFor(PICS[t.toUpperCase()][st.sub][0]):t}
function renderPics(){
  const t=st.list[st.idx],L=t.toUpperCase(),row=$('#picRow');
  $('#picsTitle').textContent=L==='X'?'Words with x':`${t} is for…`;
  row.innerHTML='';
  const card=(i,top,word,label)=>{
    const b=document.createElement('button');b.className='pic'+(st.sub===i?' on':'');b.setAttribute('aria-label','Trace '+label);
    b.innerHTML=top;const s=document.createElement('span');s.className='word';s.textContent=word;b.appendChild(s);
    if(stars[key(i<0?t:caseFor(word))])b.insertAdjacentHTML('beforeend','<span class="got"></span>');
    b.onclick=()=>{st.sub=i;loadItem();say(i<0?spoken(t):word.toLowerCase())};row.appendChild(b)};
  card(-1,`<span class="big">${t}</span>`,'letter','letter '+t);
  PICS[L].forEach(([w,e],i)=>card(i,`<span class="emo">${e}</span>`,caseFor(w),w))}
/* A letter is complete when the letter and all three picture words have stars. */
const itemsOf=i=>{const ch=st.list[i];return[ch,...PICS[ch.toUpperCase()].map(p=>caseFor(p[0]))]};
const letterComplete=i=>itemsOf(i).every(x=>stars[key(x)]);
function firstOpen(){for(let i=0;i<st.list.length;i++)if(!letterComplete(i))return i;return st.list.length}
function canNext(){return st.sub<2?!!stars[key(curText())]:letterComplete(st.idx)}
function updateNext(){$('#next').disabled=!canNext()}

function ppu(){const m=svg.getScreenCTM();return m?m.a:1}
function sizes(){const p=ppu();return{
  guide:Math.min(20,Math.max(12,22/p)),line:Math.max(2,3/p),dot:Math.max(7,15/p),
  tol:Math.min(24,Math.max(10,30/p)),font:Math.max(9,17/p)}}

function setHint(t,good){hint.textContent=t;hint.classList.toggle('good',!!good)}

function loadItem(){
  const text=curText();const it=buildItem(text);
  st.strokes=it.strokes;st.width=it.width;
  svg.setAttribute('viewBox',`${-24} ${-20} ${it.width+48} ${172}`);
  renderStatic();reset();renderStrip();
  $('#prev').disabled=st.idx===0&&st.sub<0;renderPics();updateNext();
}
function reset(){$('#sentence').hidden=true;st.si=0;st.prog=0;st.down=false;st.engaged=false;st.trail=[];st.done=false;st.demo=false;
  $('#next').classList.remove('ready');setHint('Start at the green dot');render()}

function renderStatic(){
  const z=sizes(),x0=-24,x1=st.width+24;
  let h=`<line x1="${x0}" x2="${x1}" y1="0" y2="0" stroke="var(--rule-blue)" stroke-width="${z.line}"/>
   <line x1="${x0}" x2="${x1}" y1="45" y2="45" stroke="var(--rule-blue)" stroke-width="${z.line}" stroke-dasharray="${z.line*4} ${z.line*3}"/>
   <line x1="${x0}" x2="${x1}" y1="100" y2="100" stroke="var(--rule-red)" stroke-width="${z.line}"/>
   <line x1="${x0}" x2="${x1}" y1="135" y2="135" stroke="var(--rule-blue)" stroke-width="${z.line*.6}" stroke-dasharray="${z.line} ${z.line*3}" opacity=".6"/>`;
  st.strokes.forEach(s=>{h+=`<path d="${pathD(s.pts)}" fill="none" stroke="var(--guide)" stroke-width="${z.guide}" stroke-linecap="round" stroke-linejoin="round"/>`});
  st.strokes.forEach(s=>{h+=`<path d="${pathD(s.pts)}" fill="none" stroke="var(--guide-dot)" stroke-width="${z.line*.8}" stroke-linecap="round" stroke-dasharray="0 ${z.line*3}"/>`});
  gStatic.innerHTML=h}

let raf=0;function render(){if(!raf)raf=requestAnimationFrame(draw)}
function arrow(pts,i,size){
  if(pts.length<8)return'';const k=Math.min(pts.length-1,i+9),a=pts[Math.max(0,k-3)],b=pts[k];
  let dx=b[0]-a[0],dy=b[1]-a[1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
  const tip=[b[0]+dx*size,b[1]+dy*size],bl=[b[0]-dx*size*.6-dy*size*.7,b[1]-dy*size*.6+dx*size*.7],br=[b[0]-dx*size*.6+dy*size*.7,b[1]-dy*size*.6-dx*size*.7];
  return`<polygon points="${tip} ${bl} ${br}" fill="var(--start)" opacity=".85"/>`}
function draw(){
  raf=0;const z=sizes();let h='';
  const doneColor=st.demo?'var(--demo)':'var(--trace)';
  st.strokes.forEach((s,i)=>{if(i<st.si)h+=`<path d="${pathD(s.pts)}" fill="none" stroke="${doneColor}" stroke-width="${z.guide*.82}" stroke-linecap="round" stroke-linejoin="round"/>`});
  const cur=st.strokes[st.si];
  if(cur&&st.prog>0)h+=`<path d="${pathD(cur.pts,st.prog)}" fill="none" stroke="${doneColor}" stroke-width="${z.guide*.82}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(cur&&!st.done&&!st.demo){
    const p=cur.pts[st.prog];
    h+=arrow(cur.pts,st.prog,z.dot*.75);
    if(st.prog===0){
      h+=`<g class="${st.down?'':'pulse'}"><circle cx="${p[0]}" cy="${p[1]}" r="${z.dot}" fill="var(--start)"/>
        <text x="${p[0]}" y="${p[1]}" dy=".35em" text-anchor="middle" font-family="Fredoka,system-ui" font-weight="600" font-size="${z.font}" fill="#fff">${cur.n}</text></g>`;
    }else{
      h+=`<circle cx="${p[0]}" cy="${p[1]}" r="${z.dot*.6}" fill="var(--start)" ${st.down?'':'class="pulse"'}/>`;
    }
  }
  if(st.trail.length>1)h+=`<polyline points="${st.trail.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--demo)" stroke-width="${z.line}" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>`;
  gDyn.innerHTML=h}

/* ---------- Tracing ---------- */
function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function completeStroke(){
  st.si++;st.prog=0;st.engaged=false;
  if(st.si>=st.strokes.length){celebrate()}
  else{setHint(st.strokes[st.si].n===1?'Next letter! Find the green dot':'Now stroke '+st.strokes[st.si].n,true)}
  render()}
function onDown(e){
  if(st.done||st.demo)return;
  svg.setPointerCapture(e.pointerId);
  const p=toSvg(e),q=[p.x,p.y],z=sizes(),cur=st.strokes[st.si];
  st.down=true;st.off=0;st.trail=[q];
  if(dist(q,cur.pts[st.prog])<z.tol*1.4){st.engaged=true;setHint('Keep going!');
    if(cur.pts.length<=3){st.trail=[];completeStroke();return}}
  else{st.engaged=false;setHint(st.prog===0?'Start at the green dot':'Go back to the green dot')}
  render()}
function onMove(e){
  if(!st.down)return;const z=sizes();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){
    const p=toSvg(ev),q=[p.x,p.y];st.trail.push(q);if(st.trail.length>400)st.trail.shift();
    const cur=st.strokes[st.si];if(!cur)break;
    if(!st.engaged){if(dist(q,cur.pts[st.prog])<z.tol){st.engaged=true;st.off=0;setHint('Keep going!')}continue}
    let best=st.prog;const lim=Math.min(cur.pts.length-1,st.prog+22);
    for(let j=st.prog+1;j<=lim;j++)if(dist(q,cur.pts[j])<z.tol)best=j;
    if(best>st.prog){st.prog=best;st.off=0}
    else if(dist(q,cur.pts[st.prog])>z.tol*2.2&&++st.off>5){
      st.engaged=false;svg.classList.remove('shake');void svg.getBBox();svg.classList.add('shake');
      setHint('Oops! Back to the green dot')}
    if(st.prog>=cur.pts.length-2){st.trail=[];completeStroke();if(st.done)break}
  }
  render()}
function onUp(){st.down=false;st.trail=[];render()}
svg.addEventListener('pointerdown',onDown);
svg.addEventListener('pointermove',onMove);
svg.addEventListener('pointerup',onUp);
svg.addEventListener('pointercancel',onUp);
svg.addEventListener('animationend',()=>svg.classList.remove('shake'));

function celebrate(){
  st.done=true;const t=curText();
  stars[key(t)]=true;store.set('hbd.lt.stars',stars);updateStars();renderStrip();
  setHint('Great job!',true);updateNext();if(canNext())$('#next').classList.add('ready');
  const b=$('#burst');b.innerHTML='';
  for(let i=0;i<14;i++){const a=i/14*Math.PI*2,r=110+Math.random()*60,s=document.createElement('i');
    s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');b.appendChild(s)}
  setTimeout(()=>b.innerHTML='',1300);
  renderPics();const ch=st.list[st.idx],L=ch.toUpperCase(),ws=PICS[L].map(p=>p[0]);
  if(st.sub>=0){const spokenLine=picLine(L,ws[st.sub]);showSentence(t,picLine(ch,ws[st.sub]));st.line=spokenLine;say('Great job! '+spokenLine)}
  else{setHint('Great job! Now try '+caseFor(ws[0]),true);
    say(`Great job! ${spoken(ch)}. ${L==='X'?'Words with x':L+' is for'} ${ws[0]}, ${ws[1]}, and ${ws[2]}.`)}
  if(!canNext())setHint('Finish every card to unlock the next letter')}

/* ---------- Watch demo ---------- */
function watch(){
  reset();st.demo=true;setHint('Watch how');
  let pause=0;
  const step=()=>{
    if(!st.demo)return;
    if(pause>0){pause--;return requestAnimationFrame(step)}
    const cur=st.strokes[st.si];
    if(!cur){setTimeout(()=>{if(st.demo)reset()},900);return}
    st.prog=Math.min(cur.pts.length-1,st.prog+1);
    if(st.prog>=cur.pts.length-1){st.si++;st.prog=0;pause=18}
    render();requestAnimationFrame(step)};
  requestAnimationFrame(step)}

/* ---------- Speech ---------- */
const spoken=t=>t.length===1?(t===t.toLowerCase()?'lowercase ':'capital ')+t.toUpperCase():t.toLowerCase();
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.1;u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------- UI ---------- */
function updateStars(){$('#starCount').textContent=Object.keys(stars).length}
function buildList(){st.list=LISTS[st.mode]}
function renderStrip(){
  const strip=$('#strip');strip.innerHTML='';
  st.list.forEach((t,i)=>{
    const b=document.createElement('button');b.className='chip'+(i===st.idx?' on':'');b.textContent=t;
    b.setAttribute('aria-label','Trace '+t);
    const locked=i>firstOpen();if(locked)b.classList.add('locked');
    if(letterComplete(i)){const g=document.createElement('span');g.className='got';b.appendChild(g)}
    b.onclick=()=>{if(locked)return;st.idx=i;st.sub=-1;loadItem();say(spoken(t))};
    strip.appendChild(b)});
  const on=strip.querySelector('.on');if(on)on.scrollIntoView({block:'nearest',inline:'center'})}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  st.mode=b.dataset.mode;st.sub=-1;buildList();st.idx=Math.min(firstOpen(),st.list.length-1);loadItem()});
$('#prev').onclick=()=>{
  if(st.sub>=0)st.sub--;
  else if(st.idx>0){st.idx--;st.sub=2}
  else return;
  loadItem();say(spoken(curText()))};
$('#next').onclick=()=>{
  if(!canNext())return;
  if(st.sub<2)st.sub++;
  else{st.idx=(st.idx+1)%st.list.length;st.sub=-1}
  loadItem();say(spoken(curText()))};
$('#again').onclick=reset;
$('#sayLine').onclick=()=>say(st.line);
$('#watch').onclick=watch;
$('#say').onclick=()=>say(spoken(curText()));

new ResizeObserver(()=>{renderStatic();render()}).observe(svg);
buildList();updateStars();st.idx=Math.min(firstOpen(),st.list.length-1);loadItem();
</script>
